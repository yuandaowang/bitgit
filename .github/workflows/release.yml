name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      release_upload_url: ${{ steps.create-release.outputs.upload_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BitGit ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## BitGit ${{ steps.get_version.outputs.VERSION }}

            ### Installation

            **Windows:** Download and run `BitGit_${{ steps.get_version.outputs.VERSION }}_x64-setup.exe` (NSIS installer) or `BitGit_${{ steps.get_version.outputs.VERSION }}_x64_en-US.msi` (MSI installer)

            **macOS 11 or later:** Download `BitGit_${{ steps.get_version.outputs.VERSION }}_aarch64.dmg` (Apple Silicon) or `BitGit_${{ steps.get_version.outputs.VERSION }}_x64.dmg` (Intel), open it and drag BitGit to Applications. This build is not signed or notarized by Apple, so macOS blocks its first launch: open BitGit once and close the warning, then choose **Open Anyway** under System Settings > Privacy & Security (System Preferences > Security & Privacy on macOS 12 and earlier) and confirm. BitGit needs Git (`xcode-select --install`) and Node.js 22 or later; see [INSTALL.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/INSTALL.md#macos).

            **Linux (AppImage only):** Download `bit-git_${{ steps.get_version.outputs.VERSION }}_amd64.AppImage`, make it executable (`chmod +x`) and run it. It needs FUSE 2 (`libfuse2`; `libfuse2t64` on Ubuntu 24.04), Node.js 22 or later, Git, and a running Secret Service (GNOME Keyring, KWallet or KeePassXC) to store the GitHub token. The .deb and .rpm are no longer published: they need webkit2gtk 4.0, which current distributions do not ship. For a blank window on NVIDIA drivers, see [INSTALL.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/INSTALL.md).

            ### What's New
            - The project board can be compact or a grid. Projects can carry labels, and the board filters by a label or by favorites. The search box keeps the ten latest searches
            - Compact cards show whether the branch matches its remote and how many files are uncommitted, using icons. Hover a button to see what it does, including opening a terminal in the project folder
            - A configured Git remote counts as connected, including GitLab. The card names that remote, and bulk push, pull and publish use it, not only a repository linked through GitHub
            - A new project can start from a local folder
            - Select All selects only the projects on screen. The selection bar and bulk results stay at the bottom, so the cards do not move
            - A project card no longer shows the favorite star twice

            ### In 1.2.1
            - Linking a project to an existing GitHub repository works again: the list shows each repository's owner, searching no longer closes it with an error, only the repository you pick is selected, and linking saves its URL. Thanks @zznam (#1)
            - macOS: dashboard shortcuts use ⌘ (⌘R refresh, ⌘N new project, ⌘F search, ⌘A select all, ⌘D theme) and their hints say so; Ctrl still works

            ### In 1.2.0
            - macOS: builds for macOS 11 or later on Apple Silicon and Intel, with the GitHub token kept in the Keychain. The app is not signed or notarized by Apple; see Installation
            - macOS and Linux: BitGit starts its Git service from the installed app and finds Node.js and Git through your login shell's PATH, even when opened from Finder, the Dock or a desktop menu
            - macOS and Linux: projects inside a linked folder (such as macOS `/tmp` or Fedora Atomic's `/var/home`) can be saved and recovered, and a timed-out fetch or push also stops its ssh or HTTPS helper
            - macOS: Git errors suggest `xcode-select --install` when the Command Line Tools are missing, and VS Code, Cursor and Sublime Text open without their shell command
            - Linux: only the AppImage is published; the .deb and .rpm need webkit2gtk 4.0, which current distributions no longer ship. If you installed the 1.1.2 .deb, remove it with `sudo apt remove bit-git` and use the AppImage
            - Linux: saving the GitHub token without a Secret Service says which is missing
            - Security: simple-git 4.0.2 fixes critical command-execution advisories in the Git service. Branch and tag names are validated, and cloning or linking accepts only HTTPS, SSH and `git://` remote URLs
            - Editors start directly instead of through `cmd /C` on Windows, and recoveries running in different projects each use their own GitHub token

            ### Since 1.1.0
            - Automatic updates: BitGit checks for a newer release at startup and offers to install it (Windows installers, the macOS app and the Linux AppImage)
            - Save & Recover workspace: named milestones, byte-exact checkpoints, coverage and comparison, verified recovered copies, and selective file repair behind a safety checkpoint
            - Remote checkpoint backup and import through GitHub, with remote trust and verification
            - Explicit, scoped visual Git publishing: only selected whole files or committed changes are published, with honest status and validated tag pushes
            - Automatic idle saves, exact-version notes, screenshots and checks, guided regression search, and a JSON harness CLI
            - Analytics load from one local snapshot per repository; Git service requests run concurrently and a stopped service restarts on the next request
            - One BitGit process per data directory; unhandled frontend errors surface as toasts; the Git service survives stray promise rejections
            - Linux packages build again (wry 0.24.12); 1.1.0 shipped without them

          draft: true
          prerelease: false

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Pinned labels. macos-15 is arm64 and cross-compiles the x64 build.
        include:
          - platform: 'macos-15'
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'
          - platform: 'macos-15'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-2025'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-15' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Install git-service dependencies
        run: |
          cd git-service
          npm ci

      - name: Build git-service
        run: |
          cd git-service
          npm run build

      # Apple's notary service rejects any unsigned Mach-O file in the app, and the service's dev
      # dependencies carry esbuild's binary. The service is already built, so the bundle's
      # beforeBuildCommand is overridden to skip rebuilding it without TypeScript.
      - name: Keep only the service's runtime dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          cd git-service
          npm ci --omit=dev
          echo '{"build":{"beforeBuildCommand":"npm run build"}}' > "$RUNNER_TEMP/bundle.conf.json"

      # Without an identity the bundler skips signing, and without the API key notarization, with
      # only a warning. With all six secrets set the app is signed and notarized; with none it is
      # signed ad hoc and not notarized; with only some set the job fails.
      - name: Check the signing secrets (macOS)
        id: apple
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          missing=""
          count=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_CONTENT; do
            if [ -z "${!name}" ]; then missing="$missing $name"; count=$((count + 1)); fi
          done
          if [ "$count" -eq 0 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$count" -eq 6 ]; then
            echo "::warning title=Unsigned macOS build::None of the six Apple signing secrets are set, so the ${{ matrix.target }} app is signed ad hoc and not notarized."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            for name in $missing; do echo "::error::The $name secret is not set"; done
            exit 1
          fi

      - name: Write the App Store Connect API key (macOS)
        if: runner.os == 'macOS' && steps.apple.outputs.signed == 'true'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          umask 077
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build Tauri app
        if: runner.os != 'macOS'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # Tauri CLI 1.6.3 (bundler 1.7.1) imports the certificate into a temporary keychain, signs
      # with hardened runtime, notarizes with notarytool and staples the ticket; a rejected
      # submission fails the build. Variable names checked in tooling/bundler/src/bundle/macos/sign.rs.
      - name: Build, sign and notarize Tauri app (macOS)
        if: runner.os == 'macOS' && steps.apple.outputs.signed == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config ${{ runner.temp }}/bundle.conf.json

      # Apple Silicon calls a downloaded app with no signature damaged and offers no Open Anyway;
      # with an ad-hoc signature ("-") it offers Open Anyway. The bundler signs the DMG with
      # the same identity, and macOS 15 then blocks the DMG itself (tauri-apps/tauri#12288), so
      # only the app and the updater archive are bundled here; the DMG is packaged further down.
      - name: Build Tauri app, signed ad hoc (macOS)
        if: runner.os == 'macOS' && steps.apple.outputs.signed == 'false'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --bundles app,updater --config ${{ runner.temp }}/bundle.conf.json

      - name: Verify signature, notarization and Gatekeeper (macOS)
        if: runner.os == 'macOS' && steps.apple.outputs.signed == 'true'
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/BitGit.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          xcrun stapler validate "$APP"

      # spctl and stapler reject any app without a Developer ID and a notarization ticket.
      - name: Verify the ad-hoc signature (macOS)
        if: runner.os == 'macOS' && steps.apple.outputs.signed == 'false'
        run: codesign --verify --deep --strict --verbose=2 "src-tauri/target/${{ matrix.target }}/release/bundle/macos/BitGit.app"

      - name: Smoke-test the bundled Git service (macOS)
        if: runner.os == 'macOS'
        run: node scripts/bundle-smoke.mjs "src-tauri/target/${{ matrix.target }}/release/bundle/macos/BitGit.app/Contents/Resources/_up_/git-service/dist/index.js"

      # Uploads by release ID: a lookup by tag can pick an older draft. A rerun of the job replaces
      # its earlier upload. hdiutil fails intermittently on hosted runners (actions/runner-images#7522).
      - name: Package and attach the unsigned DMG (macOS)
        if: runner.os == 'macOS' && steps.apple.outputs.signed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').package.version")
          NAME="BitGit_${VERSION}_${{ matrix.target == 'x86_64-apple-darwin' && 'x64' || 'aarch64' }}.dmg"
          STAGE="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$STAGE" "$BUNDLE/dmg"
          ditto "$BUNDLE/macos/BitGit.app" "$STAGE/BitGit.app"
          ln -s /Applications "$STAGE/Applications"
          for attempt in 1 2 3; do
            hdiutil create -volname BitGit -srcfolder "$STAGE" -format UDZO -ov "$BUNDLE/dmg/$NAME" && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 10
          done
          API="repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}"
          for id in $(gh api "$API/assets" --paginate --jq ".[] | select(.name == \"$NAME\") | .id"); do
            gh api --method DELETE "repos/${{ github.repository }}/releases/assets/$id"
          done
          gh api --method POST -H 'Content-Type: application/octet-stream' --input "$BUNDLE/dmg/$NAME" \
            "https://uploads.github.com/$API/assets?name=$NAME" --jq .browser_download_url

      # Tests the published file: extracting needs no FUSE.
      - name: Smoke-test the bundled Git service (Linux)
        if: runner.os == 'Linux'
        run: |
          APPIMAGE=$(ls "$GITHUB_WORKSPACE"/src-tauri/target/release/bundle/appimage/*.AppImage)
          chmod +x "$APPIMAGE"
          cd "$RUNNER_TEMP"
          "$APPIMAGE" --appimage-extract > /dev/null
          node "$GITHUB_WORKSPACE/scripts/bundle-smoke.mjs" "$(find "$RUNNER_TEMP/squashfs-root" -path '*/_up_/git-service/dist/index.js')"

  publish-release:
    needs: [create-release, build-tauri]
    permissions:
      contents: write
    runs-on: ubuntu-22.04

    steps:
      # By ID: the lookup by tag cannot see drafts and would create a second, empty release.
      # As a prerelease: releases/latest, which the updater reads, skips it until a person clears
      # the prerelease flag.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PATCH "repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}" -F draft=false -F prerelease=true
